[package]
name = "vault-tests"
version = "0.1.0"
edition = "2021"
description = "YBC markets on the real vault adapter binaries from ybc-vaults"

[lib]
crate-type = ["rlib"]

# Its own workspace, excluded from the root one: this crate needs ybc-vaults
# checked out beside the repo, and the contract build must not. It has its own
# target directory on purpose: sharing the root one poisons the root
# workspace's test build (duplicate soroban-sdk instances). The fixture still
# imports the binaries `stellar contract build` writes to ../../target.
[workspace]

[dev-dependencies]
# Same pin as the root workspace; mixed SDK versions make Env/Address types incompatible.
soroban-sdk = { version = "26.1.1", features = ["testutils"] }
amm = { path = "../../contracts/amm/amm", features = ["testutils"] }
factory = { path = "../../contracts/factory" }
router = { path = "../../contracts/router" }
yield_manager = { path = "../../contracts/yield/yield_manager" }
yield_manager_interface = { path = "../../contracts/yield/yield_manager_interface" }
yield_token_interface = { path = "../../contracts/tokens/yield_token_interface" }
# The protocol fixtures the adapters' own suites run on: a real Blend
# deployment from the binaries vendored in ybc-vaults, and the mock XOXNO
# controller. Same soroban-sdk as this workspace, so the two link cleanly.
vault-testkit = { path = "../../../ybc-vaults/crates/vault-testkit" }
