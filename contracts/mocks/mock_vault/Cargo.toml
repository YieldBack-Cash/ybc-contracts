[package]
name = "mock_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["contract"]
contract = []

[dependencies]
soroban-sdk = { workspace = true }
vault_interface = { path = "../../../vault/vault_interface" }
stellar-tokens = "0.7.2"
stellar-macros = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
