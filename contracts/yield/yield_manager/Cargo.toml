[package]
name = "yield_manager"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["contract"]
contract = []

[dependencies]
amm-interface = { path = "../../amm/amm-interface" }
principal_token_interface = { path = "../../tokens/principal_token_interface" }
soroban-sdk = { workspace = true }
vault_interface = { path = "../../../vault/vault_interface" }
yield_manager_interface = { path = "../yield_manager_interface" }
yield_token_interface = { path = "../../tokens/yield_token_interface" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
principal_token = { path = "../../tokens/principal_token" }
yield_token = { path = "../../tokens/yield_token" }
mock_vault = { path = "../../mocks/mock_vault" }
