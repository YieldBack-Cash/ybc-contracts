[package]
name = "principal_token"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["contract"]
contract = []

[dependencies]
soroban-sdk = { workspace = true }
soroban-token-sdk = { workspace = true }
principal_token_interface = { path = "../principal_token_interface" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
