[workspace]
resolver = "2"
members = [
  "contracts/factory",
  "contracts/tokens/principal_token",
  "contracts/tokens/principal_token_interface",
  "contracts/tokens/yield_token",
  "contracts/tokens/yield_token_interface",
  "contracts/yield/yield_manager",
  "contracts/yield/yield_manager_interface",
  "contracts/amm/amm",
  "contracts/amm/amm-interface",
  "contracts/mocks/mock_vault",
  "contracts/mocks/standard_vault",
  "contracts/treasury",
  "vault/vault_interface",
  "contracts/router",
  "tests/integration",
]
# cargo-fuzz crates build with nightly + sanitizer flags; keep them out of
# normal workspace builds.
# tests/blend is excluded until blend-contract-sdk supports soroban-sdk 26
# (its latest, 2.25.0, pins 25.3.2 — incompatible with the OZ crates' 26.1
# requirement). Re-add to members when a compatible release ships.
exclude = ["contracts/amm/amm/fuzz", "tests/blend"]

[workspace.dependencies]
# 26.1 is the newest SDK the OpenZeppelin 0.7.2 crates support (no OZ release
# targets 27 yet); mixed SDK versions make Env/Address types incompatible.
soroban-sdk = "26.1.1"
soroban-token-sdk = "26.1.1"
soroban-fixed-point-math = "1.5.0"
# OpenZeppelin stellar-contracts: Ownable for the human-owned singletons
# (factory, treasury). Market contracts keep their hand-rolled one-shot admins.
stellar-access = "0.7.2"
stellar-macros = "0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
